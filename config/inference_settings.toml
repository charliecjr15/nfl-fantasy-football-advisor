predictions_path = "data/processed/inference/v1_evaluated_2025_smoke_predictions.parquet"
sample_path = "data/sample/model_inference_smoke_sample.csv"
sample_rows = 500
verification_path = "results/tables/model_inference_smoke_verification.csv"
run_manifest_path = "results/tables/model_inference_smoke_manifest.csv"