[model]
name = "NFL Full-PPR Player-Week Projection"
version = "v1_prior_game"
target = "target_fantasy_points_ppr"
prediction_unit = "player_game"
prediction_horizon = "one_game_ahead"
positions = ["QB", "RB", "WR", "TE"]
train_separate_position_models = true
random_seed = 42

[split]
training_label = "training"
validation_label = "validation"
test_label = "test"
training_seasons = [2018, 2019, 2020, 2021, 2022, 2023]
validation_seasons = [2024]
test_seasons = [2025]
allow_random_split = false
fit_preprocessing_on_training_only = true
tune_on_validation_only = true
evaluate_test_once = true

[export]
source_table = "model_player_weeks"
parquet_path = "data/processed/modeling/model_player_weeks.parquet"
sample_path = "data/sample/model_player_weeks_model_sample.csv"
manifest_path = "data/sample/model_export_manifest.csv"
sample_row_limit = 500

[quality]
expected_source_rows = 45693
expected_source_columns = 116
expected_training_rows = 33792
expected_validation_rows = 5864
expected_test_rows = 6037
fail_on_duplicate_key = true
fail_on_missing_target = true
fail_on_split_mismatch = true
fail_on_unexpected_column = true
fail_on_forbidden_predictor = true

[baseline]
models = [
    "training_position_mean",
    "previous_game",
    "rolling_3_game",
    "rolling_5_game",
]
primary_baseline = "rolling_5_game"
evaluation_split = "validation"
allow_test_evaluation = false
fallback_order = [
    "rolling_5_game",
    "rolling_3_game",
    "previous_game",
    "training_position_mean",
]

[baseline.output]
predictions_path = "results/tables/baseline_validation_predictions.csv"
metrics_path = "results/tables/baseline_validation_metrics.csv"
weekly_metrics_path = "results/tables/baseline_validation_weekly_metrics.csv"

[evaluation]
regression_metrics = ["mae", "rmse"]
ranking_metrics = ["spearman_rank_correlation"]
report_overall = true
report_by_position = true
report_by_week = true

[evaluation.starter_cutoffs]
QB = 12
RB = 24
WR = 24
TE = 12

[preprocessing]
numeric_missing_strategy = "median"
categorical_missing_strategy = "most_frequent"
categorical_encoding = "one_hot"
scale_numeric_for_linear_models = true
preserve_missingness_flags = true

[columns]
key = ["season", "week", "player_id"]

target = "target_fantasy_points_ppr"

metadata = [
    "season",
    "game_id",
    "game_date",
    "player_id",
    "player_name",
    "player_display_name",
    "data_split",
    "feature_version",
    "previous_game_season",
    "previous_game_week",
    "previous_game_date",
    "previous_team",
    "created_at",
